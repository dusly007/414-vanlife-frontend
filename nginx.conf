server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router – sert index.html pour toutes les routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy pour les endpoints du API
    location /api/ {
        # Résolution DNS interne via AWS Service Discovery (Cloud Map)
        # Permet de cibler dynamiquement les conteneurs de l'API sans dépendre d'IP fixes
        proxy_pass http://api.vanlife.local:3000/; 
        
        # Configuration standard pour la gestion des WebSockets et connexions persistantes
        proxy_http_version 1.1; 
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Transfert des informations d'origine du client vers le backend (Traçabilité et Logs)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

